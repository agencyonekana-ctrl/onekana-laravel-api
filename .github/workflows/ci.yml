name: API CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, fileinfo, mbstring
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
      - run: composer audit
      - name: Check PHP syntax
        shell: bash
        run: find src tests scripts -name '*.php' -print0 | xargs -0 -n1 php -l
